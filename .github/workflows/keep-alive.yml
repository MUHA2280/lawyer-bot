name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render to prevent sleep
        run: |
          echo "Pinging https://lawyer-bot-zq3y.onrender.com/"
          curl -s -o /dev/null -w "CODE:%{http_code}\n" https://lawyer-bot-zq3y.onrender.com/
          sleep 10
          curl -s https://lawyer-bot-zq3y.onrender.com/ || true
